<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Todo Kanban</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="top-area">
        <h2>Today Board</h2>
        <p class="helper-text">Click a card to move it to the next step, or drag it anywhere you want.</p>

        <div class="board">
            <div class="column drop-zone" id="todo-column">
                <h3>To Do</h3>
                </div>

                <div class="column drop-zone" id="doing-column">
                <h3>Doing</h3>
                </div>

                <div class="column drop-zone" id="done-column">
                <h3>Done</h3>
            </div>
        </div>
    </div>

    <div class="bottom-area">

        <div class="taskpool-header">
            <h2>Task Pool</h2>

            <div class="new-project-area">
                <input id="new-project-input" type="text" placeholder="New project name">
                <button id="add-project-button">Add Project</button>
            </div>
        </div>

        <div class="projects-row">
            <div class="project-section drop-zone">
                <h3>Work</h3>

                <div class="project-task-input-area">
                <input class="project-task-input" type="text" placeholder="Type a new task">
                <button class="project-add-task-button">Add Task</button>
                </div>
            </div>

            <div class="project-section drop-zone">
                <h3>Presentations</h3>

                <div class="project-task-input-area">
                <input class="project-task-input" type="text" placeholder="Type a new task">
                <button class="project-add-task-button">Add Task</button>
                </div>
            </div>
        </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
